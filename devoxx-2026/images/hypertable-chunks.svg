<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#ffffff"/>

  <!-- Left side: Simple colored circles (bubbles) -->
  <circle cx="80" cy="120" r="20" fill="#FF6B35"/>
  <circle cx="80" cy="200" r="20" fill="#4A90E2"/>
  <circle cx="80" cy="280" r="20" fill="#50C878"/>
  <circle cx="80" cy="360" r="20" fill="#FFD700"/>

  <!-- Arrows from bubbles to chunks area -->
  <path d="M 110 120 L 180 120" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 110 200 L 180 200" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 110 280 L 180 280" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 110 360 L 180 360" stroke="#999" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Vertical axis (SPACE) - left side -->
  <line x1="200" y1="70" x2="200" y2="420" stroke="#E6A23C" stroke-width="3"/>
  <path d="M 195 80 L 200 70 L 205 80" fill="#E6A23C"/>
  <path d="M 195 410 L 200 420 L 205 410" fill="#E6A23C"/>

  <text x="200" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">SPACE</text>
  <text x="200" y="470" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">hash partitioning</text>
  <text x="200" y="490" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#E6A23C" text-anchor="middle">dimension: country_code</text>

  <!-- Chunks grid (4 rows × 6 columns) -->
  <!-- Row 1: Orange chunks -->
  <rect x="240" y="80" width="70" height="50" rx="8" fill="#FF6B35" opacity="1.0"/>
  <rect x="330" y="80" width="70" height="50" rx="8" fill="#FF6B35" opacity="0.9"/>
  <rect x="420" y="80" width="70" height="50" rx="8" fill="#FF6B35" opacity="0.7"/>
  <rect x="510" y="80" width="70" height="50" rx="8" fill="#FF6B35" opacity="0.5"/>
  <rect x="600" y="80" width="70" height="50" rx="8" fill="#FF6B35" opacity="0.3"/>
  <rect x="690" y="80" width="70" height="50" rx="8" fill="#FF6B35" opacity="0.15"/>

  <!-- Row 2: Blue chunks -->
  <rect x="240" y="150" width="70" height="50" rx="8" fill="#4A90E2" opacity="1.0"/>
  <rect x="330" y="150" width="70" height="50" rx="8" fill="#4A90E2" opacity="0.9"/>
  <rect x="420" y="150" width="70" height="50" rx="8" fill="#4A90E2" opacity="0.7"/>
  <rect x="510" y="150" width="70" height="50" rx="8" fill="#4A90E2" opacity="0.5"/>
  <rect x="600" y="150" width="70" height="50" rx="8" fill="#4A90E2" opacity="0.3"/>
  <rect x="690" y="150" width="70" height="50" rx="8" fill="#4A90E2" opacity="0.15"/>

  <!-- Row 3: Green chunks -->
  <rect x="240" y="220" width="70" height="50" rx="8" fill="#50C878" opacity="1.0"/>
  <rect x="330" y="220" width="70" height="50" rx="8" fill="#50C878" opacity="0.9"/>
  <rect x="420" y="220" width="70" height="50" rx="8" fill="#50C878" opacity="0.7"/>
  <rect x="510" y="220" width="70" height="50" rx="8" fill="#50C878" opacity="0.5"/>
  <rect x="600" y="220" width="70" height="50" rx="8" fill="#50C878" opacity="0.3"/>
  <rect x="690" y="220" width="70" height="50" rx="8" fill="#50C878" opacity="0.15"/>

  <!-- Row 4: Yellow chunks -->
  <rect x="240" y="290" width="70" height="50" rx="8" fill="#FFD700" opacity="1.0"/>
  <rect x="330" y="290" width="70" height="50" rx="8" fill="#FFD700" opacity="0.9"/>
  <rect x="420" y="290" width="70" height="50" rx="8" fill="#FFD700" opacity="0.7"/>
  <rect x="510" y="290" width="70" height="50" rx="8" fill="#FFD700" opacity="0.5"/>
  <rect x="600" y="290" width="70" height="50" rx="8" fill="#FFD700" opacity="0.3"/>
  <rect x="690" y="290" width="70" height="50" rx="8" fill="#FFD700" opacity="0.15"/>

  <!-- "Chunk" label with arrow -->
  <rect x="690" y="80" width="70" height="50" rx="8" fill="none" stroke="#409EFF" stroke-width="2"/>
  <text x="820" y="110" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="start">← Chunk</text>

  <!-- Horizontal axis (TIME) - bottom -->
  <line x1="240" y1="380" x2="760" y2="380" stroke="#409EFF" stroke-width="3"/>
  <path d="M 250 375 L 240 380 L 250 385" fill="#409EFF"/>
  <path d="M 750 375 L 760 380 L 750 385" fill="#409EFF"/>

  <text x="500" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">TIME</text>
  <text x="260" y="430" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="start">older</text>
  <text x="730" y="430" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="end">newer</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999"/>
    </marker>
  </defs>
</svg>
